  return {ent_v:sumYears(y=>DATA.estoque[y].ent_v), sai_v:sumYears(y=>DATA.estoque[y].sai_v),
    ent_q:sumYears(y=>DATA.estoque[y].ent_q), sai_q:sumYears(y=>DATA.estoque[y].sai_q),
    giro:YEARS.reduce((a,y)=>a+DATA.estoque[y].giro,0)/YEARS.length};
}
function renderEstoque(){
  const d = estoqueAgg();
  const yEnd = isAll()?YL:state.year;
  const saldoFim = DATA.estoque[yEnd].saldo[11];
  const pos = DATA.estoque.pos.slice().sort((a,b)=>b.v-a.v);
  const posTot = pos.reduce((a,p)=>a+p.v,0);
  const rows = pos.map(p=>{
    const st = p.q<p.min ? '<span class="badge bad">Abaixo do mínimo</span>' : p.q<p.alvo ? '<span class="badge warn">Abaixo do alvo</span>' : '<span class="badge ok">OK</span>';
    return '<tr><td>'+esc(p.n)+' <span style="color:var(--dim);font-family:var(--mono);font-size:10px">· '+esc(p.marca)+'</span></td><td>'+esc(p.cat)+'</td>'+
      '<td>'+nf0.format(p.q)+'</td><td>'+nf0.format(p.min)+' / '+nf0.format(p.alvo)+'</td><td>'+fm(p.cm)+'</td><td>'+fm(p.v)+'</td><td>'+st+'</td></tr>';
  }).join('');
  return '<div class="grid g4">'+
    kpi('Saldo de estoque · 12/'+yEnd, compact(saldoFim), 'brass', 'Conta 1.1.3.01 · custo médio')+
    kpi('Entradas (compras) · '+yearLabel(), compact(d.ent_v), 'pos', nf0.format(d.ent_q)+' unidades')+
    kpi('Saídas (CMV) · '+yearLabel(), compact(d.sai_v), 'neg', nf0.format(d.sai_q)+' unidades')+
    kpi('Giro de estoque', d.giro.toLocaleString('pt-BR',{maximumFractionDigits:1})+'× / ano', 'steel', (12/d.giro).toLocaleString('pt-BR',{maximumFractionDigits:0})+' meses de cobertura média')+
  '</div>'+
  '<div class="grid g2 mt"><div class="card"><h3>Saldo contábil do estoque <span class="sub">'+(isAll()?'fechamentos anuais':'mensal · '+state.year)+'</span></h3>'+
  '<div class="chartbox tall"><canvas id="ch-e1"></canvas></div></div>'+
  '<div class="card"><h3>Entradas × saídas <span class="sub">'+(isAll()?'anual':'mensal · '+state.year)+'</span></h3><div class="chartbox tall"><canvas id="ch-e2"></canvas></div></div></div>'+
  '<div class="card mt"><h3>Posição por produto <span class="sub">inventário 31/12/'+YL+' · '+compact(posTot)+'</span></h3>'+
  '<div class="mt tbl-scroll"><table class="data"><tr><th>Produto</th><th>Categoria</th><th>Qtde</th><th>Mín / Alvo</th><th>Custo médio</th><th>Valor R$</th><th>Status</th></tr>'+rows+'</table></div></div>';
}
function postEstoque(){
  if(isAll()){
    mkChart('ch-e1',{type:'bar',data:{labels:YEARS,datasets:[{data:YEARS.map(y=>DATA.estoque[y].saldo[11]),
      backgroundColor:C.brassA,borderColor:C.brass,borderWidth:1.5,borderRadius:5}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:ttipDefault},scales:{x:axCat(),y:axMoney()}}});
    mkChart('ch-e2',{type:'bar',data:{labels:YEARS,datasets:[
      {label:'Entradas',data:YEARS.map(y=>DATA.estoque[y].ent_v),backgroundColor:C.posA,borderColor:C.pos,borderWidth:1.5,borderRadius:5},
      {label:'Saídas',data:YEARS.map(y=>-DATA.estoque[y].sai_v),backgroundColor:C.negA,borderColor:C.neg,borderWidth:1.5,borderRadius:5}]},
      options:{maintainAspectRatio:false,plugins:{legend:legendOpt(),tooltip:ttipDefault},scales:{x:axCat(),y:axMoney()}}});
  } else {
    const d = DATA.estoque[state.year];
    mkChart('ch-e1',{type:'line',data:{labels:MESES,datasets:[{label:'Saldo',data:d.saldo,
      borderColor:C.brass,backgroundColor:C.brassA,fill:true,tension:.35,pointRadius:2.5,pointBackgroundColor:C.brass,borderWidth:2}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:ttipDefault},scales:{x:axCat(),y:axMoney()}}});
    mkChart('ch-e2',{type:'bar',data:{labels:MESES,datasets:[
      {label:'Entradas',data:d.mEnt,backgroundColor:C.posA,borderColor:C.pos,borderWidth:1.2,borderRadius:4},
      {label:'Saídas',data:d.mSai.map(v=>-v),backgroundColor:C.negA,borderColor:C.neg,borderWidth:1.2,borderRadius:4}]},
      options:{maintainAspectRatio:false,plugins:{legend:legendOpt(),tooltip:ttipDefault},scales:{x:axCat(),y:axMoney()}}});
  }
}

/* ===================== IMPOSTOS ===================== */
function impAgg(){
  if(!isAll()) return DATA.imp[state.year];
  const trib={};
  YEARS.forEach(y=>DATA.imp[y].trib.forEach(t=>{ trib[t.n]=trib[t.n]||{db:0,cb:0,vr:0}; trib[t.n].db+=t.db; trib[t.n].cb+=t.cb; trib[t.n].vr+=t.vr; }));
  return {trib:Object.entries(trib).map(([n,v])=>({n,...v})), total:sumYears(y=>DATA.imp[y].total), aberto:sumYears(y=>DATA.imp[y].aberto)};
}

function lalurCard(){
  const ys = isAll()?YEARS:[state.year];
  const tris = ys.flatMap(y=>DATA.lalur[y].tri);
  /* Parte A — consolidação */
  const lair = tris.reduce((a,t)=>a+t.lair,0);
  const adi = tris.reduce((a,t)=>a+t.adi,0);
  const exc = tris.reduce((a,t)=>a+t.exc,0);
  const comp = tris.reduce((a,t)=>a+t.comp,0);
  const base = tris.reduce((a,t)=>a+t.base,0);
  const irpj = tris.reduce((a,t)=>a+t.irpj,0);
  const csll = tris.reduce((a,t)=>a+t.csll,0);
  const prejPer = tris.reduce((a,t)=>a+t.prej_per,0);
  const saldoFim = DATA.lalur[isAll()?YL:state.year].saldo_prej_fim;
  const parteA = '<table class="ledger"><tr><th>Parte A — Demonstração do Lucro Real</th><th>'+yearLabel()+' · R$</th></tr>'+
    '<tr class="ind"><td>Resultado contábil antes do IRPJ e da CSLL — LAIR</td><td>'+fmc(lair)+'</td></tr>'+
    '<tr class="ind"><td>(+) Adições — despesas indedutíveis</td><td>'+fm(adi)+'</td></tr>'+
    '<tr class="ind"><td>(−) Exclusões</td><td>'+fm(exc)+'</td></tr>'+
    '<tr class="ind"><td>(−) Compensação de prejuízos fiscais (trava 30%)</td><td>'+fm(comp)+'</td></tr>'+
    '<tr class="sub"><td>Lucro Real — soma das bases trimestrais positivas</td><td>'+fm(base)+'</td></tr>'+
    '<tr class="ind"><td>IRPJ — 15% + adicional de 10% acima de R$ 60 mil/trimestre</td><td>'+fm(irpj)+'</td></tr>'+
    '<tr class="ind"><td>CSLL — 9% sobre a base</td><td>'+fm(csll)+'</td></tr>'+
    '<tr class="tot"><td>TOTAL IRPJ + CSLL DEVIDOS</td><td>'+fm(irpj+csll)+'</td></tr>'+
    '</table>';
  /* Parte B — controle do prejuízo fiscal acumulado */
  const saldoIni = tris.length ? (tris[0].saldo_prej - tris[0].prej_per + tris[0].comp) : 0;
  const parteB = '<table class="ledger"><tr><th>Parte B — Controle do Prejuízo Fiscal</th><th>'+yearLabel()+' · R$</th></tr>'+
    '<tr class="ind"><td>Saldo de prejuízo fiscal no início</td><td>'+fm(saldoIni)+'</td></tr>'+
    '<tr class="ind"><td>(+) Prejuízo fiscal do período</td><td>'+fm(prejPer)+'</td></tr>'+
    '<tr class="ind"><td>(−) Compensação utilizada</td><td>'+fm(comp)+'</td></tr>'+
    '<tr class="tot"><td>SALDO A COMPENSAR (LALUR Parte B)</td><td>'+fm(saldoFim)+'</td></tr>'+
    '</table>';
  /* quadro trimestral */
  const trRows = ys.map(y=>DATA.lalur[y].tri.map(t=>{
    const efet = t.base>0 ? (t.irpj+t.csll)/t.base : 0;
    return '<tr><td>'+t.p+'</td><td>'+fmc(t.lair)+'</td><td>'+fm(t.adi)+'</td><td>'+fm(t.comp)+'</td>'+
      '<td style="font-weight:600">'+fm(t.base)+'</td><td>'+fm(t.irpj)+'</td><td>'+fm(t.csll)+'</td>'+
      '<td style="color:var(--dim)">'+(t.base>0?pct(efet):'–')+'</td></tr>';
  }).join('')).join('');
  return '<div class="grid g2 mt">'+
    '<div class="card"><h3>LALUR — Livro de Apuração do Lucro Real <span class="sub">'+yearLabel()+' · e-Lalur/ECF</span></h3>'+
    '<div class="tbl-scroll mt">'+parteA+'</div>'+
    '<div class="mt tbl-scroll">'+parteB+'</div>'+
    '<div class="section-note">'+(saldoFim>1?'A entidade acumulou prejuízo fiscal de '+compact(saldoFim)+' até '+yearLabel()+', controlado na Parte B e compensável em exercícios futuros à razão de até 30% do lucro real de cada período (trava dos 30%).':'A entidade não mantém saldo relevante de prejuízo fiscal a compensar: as bases trimestrais positivas foram tributadas no próprio período.')+' O adicional de IRPJ de 10% incide sobre a parcela do lucro real trimestral que excede R$ 60 mil.</div></div>'+
    '<div class="card"><h3>Apuração trimestral do LAIR ao Lucro Real <span class="sub">'+yearLabel()+'</span></h3>'+
    '<div class="mt tbl-scroll"><table class="data"><tr><th>Trim.</th><th>LAIR contábil</th><th>Adições</th><th>Compens.</th><th>Lucro Real</th><th>IRPJ</th><th>CSLL</th><th>Alíq. efet.</th></tr>'+
    trRows+'</table></div>'+
    '<div class="section-note">Trimestres com resultado negativo têm base zerada e alimentam o prejuízo fiscal da Parte B; trimestres positivos são tributados pelo IRPJ (15% + adicional) e pela CSLL (9%). A apuração é trimestral e definitiva.</div></div></div>';
}

function renderImp(){
  const d = impAgg();
  const irpjCsll = d.trib.filter(t=>['IRPJ','CSLL'].includes(t.n)).reduce((a,t)=>a+t.vr,0);
  const consumo = d.total - irpjCsll;
  const rows = d.trib.slice().sort((a,b)=>b.vr-a.vr).map(t=>'<tr><td><b style="color:var(--text)">'+t.n+'</b></td>'+
    '<td>'+compact(t.db)+'</td><td>'+compact(t.cb)+'</td><td style="font-weight:600">'+compact(t.vr)+'</td>'+
    '<td style="color:var(--dim)">'+pct(t.vr/d.total)+'</td></tr>').join('');
  return '<div class="grid g4">'+
    kpi('Total apurado a recolher · '+yearLabel(), compact(d.total), 'brass', 'ICMS + PIS + COFINS + IRPJ + CSLL')+
    kpi('Tributos sobre consumo', compact(consumo), '', 'ICMS, PIS e COFINS')+
    kpi('Tributos sobre o lucro', compact(irpjCsll), 'steel', 'Lucro Real · apuração trimestral')+
    kpi('Saldo em aberto', compact(d.aberto), d.aberto>0?'neg':'pos', d.aberto>0?'Guias a recolher':'Sem pendências no período')+
  '</div>'+
  '<div class="grid g23 mt"><div class="card"><h3>Apuração por período <span class="sub">'+(isAll()?'anual':'competências · '+state.year)+'</span></h3>'+
  '<div class="chartbox tall"><canvas id="ch-i1"></canvas></div></div>'+
  '<div class="card"><h3>Por tributo <span class="sub">'+yearLabel()+'</span></h3><div class="chartbox tall"><canvas id="ch-i2"></canvas></div></div></div>'+
  '<div class="card mt"><h3>Memória de apuração <span class="sub">débitos × créditos por tributo · '+yearLabel()+'</span></h3>'+
  '<div class="mt tbl-scroll"><table class="data"><tr><th>Tributo</th><th>Débitos · base de cálculo (IRPJ/CSLL)</th><th>Créditos apropriados</th><th>A recolher</th><th>% carga</th></tr>'+rows+'</table></div>'+
  '<div class="section-note">Regime não cumulativo: créditos de ICMS, PIS (1,65%) e COFINS (7,6%) sobre compras compensam os débitos das saídas. IRPJ 15% + adicional de 10% sobre a parcela do lucro trimestral que excede R$ 60 mil · CSLL 9%.</div></div>'+
  lalurCard();
}
function postImp(){
  const d = impAgg();
  const tribs = ['ICMS','PIS','COFINS','IRPJ','CSLL'];
  const cores = [C.brass,C.steel,'#7FB8AE',C.neg,'#A78BC9'];
  if(isAll()){
    mkChart('ch-i1',{type:'bar',data:{labels:YEARS,datasets:tribs.map((t,i)=>({label:t,
      data:YEARS.map(y=>{ const x=DATA.imp[y].trib.find(z=>z.n===t); return x?x.vr:0; }),
      backgroundColor:cores[i]+'40',borderColor:cores[i],borderWidth:1.2,borderRadius:3}))},
      options:{maintainAspectRatio:false,plugins:{legend:legendOpt(),tooltip:ttipDefault},scales:{x:{...axCat(),stacked:true},y:{...axMoney(),stacked:true}}}});
  } else {
    const D = DATA.imp[state.year];
    mkChart('ch-i1',{type:'line',data:{labels:D.periodos.map(p=>p.includes('T') ? 'IR/CS '+p.slice(4)+'º tri' : MESES[+p.slice(5,7)-1]),datasets:[{label:'A recolher',data:D.vr_serie,
      borderColor:C.brass,backgroundColor:C.brassA,fill:true,tension:.35,pointRadius:2.5,pointBackgroundColor:C.brass,borderWidth:2}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:ttipDefault},scales:{x:axCat(),y:axMoney()}}});
  }
  const ent = d.trib.slice().sort((a,b)=>b.vr-a.vr);
  mkChart('ch-i2',{type:'doughnut',data:{labels:ent.map(t=>t.n),datasets:[{data:ent.map(t=>t.vr),
    backgroundColor:ent.map(t=>cores[tribs.indexOf(t.n)]),borderColor:'#12151C',borderWidth:2}]},
    options:{maintainAspectRatio:false,cutout:'60%',plugins:{legend:legendOpt('right'),tooltip:ttipDefault}}});
}

/* ===================== registry + boot ===================== */
const RENDER = {demo:renderDemo, concil:renderConcil, folha:renderFolha, cp:renderCP, cr:renderCR,
  imob:renderImob, intang:renderIntang, estoque:renderEstoque, imp:renderImp,
  budget:renderBudget, fpa:renderFPA, razao:renderRazao, notas:renderNotas, ind:renderInd, ctrl:renderCtrl, home:renderHome};
const POST = {
  demo(){ tabsPost(); ({bp:postBP,dre:postDRE,dra:postDRA,dva:postDVA,dmpl:postDMPL,dfc:postDFC}[state.tab])(); },
  concil:postConcil, folha:postFolha, cp:postCP, cr:postCR,
  imob:postImob, intang:postIntang, estoque:postEstoque, imp:postImp,
  budget:postBudget, fpa:postFPA, razao:postRazao, notas:postNotas, ind:postInd, ctrl:postCtrl, home:postHome};

initShell();
render();

</script>
