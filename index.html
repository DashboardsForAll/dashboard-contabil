<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFA · Controladoria — Demonstrações Financeiras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0B0D11; --panel:#12151C; --panel2:#171B24; --panel3:#1D222E;
  --line:#242A37; --line2:#2E3646;
  --text:#E9E5DB; --muted:#8B93A3; --dim:#5C6474;
  --brass:#C9A557; --brass-dim:#8A7440; --steel:#6C9CC4; --steel-dim:#41637F;
  --pos:#4FAE83; --neg:#D0655A;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Archivo',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;
  background-image:radial-gradient(1200px 600px at 85% -10%,rgba(201,165,87,.05),transparent 60%),
                   radial-gradient(900px 500px at -10% 110%,rgba(108,156,196,.04),transparent 60%);}
::selection{background:rgba(201,165,87,.3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}

/* ---------- SIDEBAR ---------- */
.sidebar{background:linear-gradient(180deg,#101319 0%,#0C0E13 100%);border-right:1px solid var(--line);
  padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.logo{display:flex;flex-direction:column;gap:6px;padding:2px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.logo img{width:130px;opacity:.92}
.logo .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--brass);text-transform:uppercase}
.navgroup{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;
  color:var(--muted);font-weight:500;font-size:13.5px;border:1px solid transparent;transition:all .15s;user-select:none}
.nav-item:hover{color:var(--text);background:var(--panel2)}
.nav-item.active{color:var(--text);background:linear-gradient(90deg,rgba(201,165,87,.13),rgba(201,165,87,.04));
  border-color:rgba(201,165,87,.25)}
.nav-item.active .ni{color:var(--brass)}
.nav-item .ni{width:17px;height:17px;flex:none;color:var(--dim)}
.nav-item .ni svg{width:100%;height:100%;display:block}
.sb-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--line)}
.sb-foot .fx{font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.7}

/* ---------- TOPBAR ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:rgba(11,13,17,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tb-title{min-width:0}
.tb-title .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass)}
.tb-title h1{font-size:19px;font-weight:700;letter-spacing:-.01em;font-stretch:110%}
.seal{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px dashed rgba(201,165,87,.4);
  border-radius:8px;padding:6px 12px;font-family:var(--mono);font-size:10.5px;color:var(--muted);background:rgba(201,165,87,.04)}
.seal b{color:var(--brass);font-weight:600}
.seal .ok{color:var(--pos);font-weight:600}
.yearsel{display:flex;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:3px;gap:2px}
.yearsel button{background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:12px;font-weight:500;
  padding:5px 12px;border-radius:6px;cursor:pointer;transition:all .15s}
.yearsel button:hover{color:var(--text)}
.yearsel button.on{background:var(--brass);color:#141005;font-weight:600}
.yearsel button.on.all{background:var(--steel);color:#0A1219}

/* ---------- CONTENT ---------- */
.content{padding:24px 26px 60px;max-width:1460px;width:100%;margin:0 auto}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
.mt{margin-top:16px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;
  padding:18px 20px;min-width:0}
.card h3{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--text);display:flex;align-items:baseline;gap:8px}
.card h3 .sub{font-family:var(--mono);font-size:10px;color:var(--dim);font-weight:400;letter-spacing:.08em}
.card .eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.kpi .val{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-.02em;margin-top:8px;white-space:nowrap}
.kpi .val.pos{color:var(--pos)} .kpi .val.neg{color:var(--neg)} .kpi .val.brass{color:var(--brass)} .kpi .val.steel{color:var(--steel)}
.kpi .foot{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:5px}
.chartbox{position:relative;height:260px;margin-top:14px}
.chartbox.tall{height:300px}.chartbox.short{height:210px}

/* ---------- STATEMENT TABS ---------- */
.stmt-tabs{display:flex;gap:6px;margin:4px 0 18px;flex-wrap:wrap}
.stmt-tabs button{background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;color:var(--muted);
  font-family:var(--sans);font-weight:600;font-size:12.5px;letter-spacing:.02em;padding:8px 16px;border-radius:9px;cursor:pointer;transition:all .15s}
.stmt-tabs button small{display:block;font-family:var(--mono);font-weight:400;font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.stmt-tabs button:hover{color:var(--text);border-color:var(--line2)}
.stmt-tabs button.on{color:var(--brass);border-color:rgba(201,165,87,.45);border-bottom-color:var(--brass);background:linear-gradient(180deg,rgba(201,165,87,.09),transparent)}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:-6px 0 16px}
.chips .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-right:6px}
.chips button{background:var(--panel2);border:1px solid var(--line2);color:var(--muted);font-family:var(--mono);font-size:11px;
  padding:4px 9px;border-radius:6px;cursor:pointer;transition:all .12s}
.chips button:hover{color:var(--text)}
.chips button.on{background:var(--steel);border-color:var(--steel);color:#0A1219;font-weight:600}
select.sel{background:var(--panel2);border:1px solid var(--line2);color:var(--text);font-family:var(--mono);font-size:12px;
  padding:7px 10px;border-radius:8px;outline:none;max-width:100%}
select.sel:focus{border-color:var(--brass)}
.ctlrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.ctlrow .fld{display:flex;flex-direction:column;gap:5px}
.ctlrow .fld .eyebrow{margin:0}
td.vp{color:var(--pos)!important} td.vn{color:var(--neg)!important}
.dc{font-family:var(--mono);font-size:9px;color:var(--dim);margin-left:4px}

/* ---------- LEDGER TABLES ---------- */
table.ledger{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
table.ledger th{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  font-weight:500;text-align:right;padding:6px 10px;border-bottom:1px solid var(--line2)}
table.ledger th:first-child{text-align:left}
table.ledger td{padding:5px 10px;text-align:right;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
table.ledger td:first-child{text-align:left;color:var(--muted);font-family:var(--sans);font-size:12.5px;white-space:normal}
table.ledger tr.ind td:first-child{padding-left:26px}
table.ledger tr.ind2 td:first-child{padding-left:42px}
table.ledger tr.sec td{padding-top:12px;color:var(--brass);font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
table.ledger tr.sub td{border-top:1px solid var(--line2);font-weight:600;color:var(--text)}
table.ledger tr.sub td:first-child{color:var(--text);font-weight:600}
table.ledger tr.tot td{border-top:1px solid var(--brass-dim);border-bottom:3px double var(--brass-dim);font-weight:600;color:var(--brass);padding-top:7px;padding-bottom:7px}
table.ledger tr.tot td:first-child{color:var(--brass);font-weight:700}
table.ledger tr:hover:not(.sec) td{background:rgba(255,255,255,.015)}
table.ledger .n{color:var(--neg)} table.ledger .p{color:var(--pos)}
.tbl-scroll{overflow-x:auto}

/* generic data table */
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  font-weight:500;text-align:right;padding:7px 10px;border-bottom:1px solid var(--line2)}
table.data th:first-child{text-align:left}
table.data td{padding:6px 10px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--text);
  border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
table.data td:first-child{text-align:left;font-family:var(--sans);color:var(--muted);white-space:normal}
table.data.acoes td{white-space:normal;text-align:left;font-family:var(--sans);font-size:12px;vertical-align:top;line-height:1.5}
table.data.acoes td:first-child{min-width:130px}
table.data.acoes td:last-child{text-align:right}
table.data tr:last-child td{border-bottom:none}
table.data tr:hover td{background:rgba(255,255,255,.015)}
.badge{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:2px 8px;border-radius:20px;border:1px solid}
.badge.ok{color:var(--pos);border-color:rgba(79,174,131,.4);background:rgba(79,174,131,.08)}
.badge.warn{color:var(--brass);border-color:rgba(201,165,87,.4);background:rgba(201,165,87,.08)}
.badge.bad{color:var(--neg);border-color:rgba(208,101,90,.4);background:rgba(208,101,90,.08)}
.bar-mini{height:5px;border-radius:3px;background:var(--panel3);overflow:hidden;min-width:70px}
.bar-mini i{display:block;height:100%;background:var(--brass)}

.section-note{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:10px;line-height:1.7}
.hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line2);border-radius:20px;padding:3px 11px}
.pill b{color:var(--text);font-weight:600}

@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:relative;height:auto;flex-direction:column}
  .content{padding:18px 14px 50px}
  .g4,.g3,.g2{grid-template-columns:1fr}
  .seal{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button:focus-visible,.nav-item:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.print-btn{background:var(--panel2);border:1px solid var(--line2);color:var(--muted);font-family:var(--mono);
  font-size:12px;padding:8px 13px;border-radius:9px;cursor:pointer;transition:all .12s}
.print-btn:hover{color:var(--brass);border-color:rgba(201,165,87,.5)}
.print-head{display:none}
.nref{font-family:var(--mono);font-size:8.5px;color:var(--steel);border:1px solid rgba(108,156,196,.35);border-radius:4px;
  padding:0 4px;margin-left:6px;cursor:pointer;white-space:nowrap;vertical-align:1px}
.nref:hover{color:var(--brass);border-color:rgba(201,165,87,.5)}
.nota-blk{margin-bottom:6px}
.nota-blk h4{font-family:var(--display);font-size:13.5px;color:var(--brass);letter-spacing:.02em;margin:18px 0 6px}
.nota-blk p{font-size:12.5px;color:var(--muted);line-height:1.65;margin:6px 0}
.nota-blk .data{margin-top:8px}
.csv-mini{margin-left:auto;background:none;border:1px solid var(--line2);color:var(--dim);font-family:var(--mono);
  font-size:9.5px;letter-spacing:.08em;padding:3px 9px;border-radius:6px;cursor:pointer;transition:.15s;flex:0 0 auto}
.csv-mini:hover{color:var(--brass);border-color:var(--brass)}
.card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.sim-grid{grid-template-columns:1fr}}
.sim-ctl{margin:12px 0}
.sim-ctl label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.sim-ctl label b{color:var(--brass);font-size:12px}
.sim-ctl input[type=range]{width:100%;accent-color:var(--brass);height:4px;cursor:pointer}
.sim-out{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.sim-out table{width:100%;border-collapse:collapse;font-size:12px}
.sim-out td{padding:7px 4px;border-bottom:1px solid var(--line)}
.sim-out tr:last-child td{border-bottom:none}
.sim-out td:last-child{text-align:right;font-family:var(--mono);font-weight:600}
.hl-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;padding:6px 14px;border-radius:8px;border:1px solid}
.alert-item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.alert-item:last-child{border-bottom:none}
.alert-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.golink{background:none;border:1px solid var(--line2);color:var(--steel);font-family:var(--mono);font-size:9.5px;
  letter-spacing:.08em;padding:2px 8px;border-radius:5px;cursor:pointer;white-space:nowrap}
.golink:hover{border-color:var(--steel)}
@media print{
  :root{--bg:#fff;--panel:#fff;--panel2:#f4f2ee;--line:#c9c5bc;--line2:#b5b0a5;--text:#17150f;--muted:#3d3a32;
    --dim:#6e6a5e;--brass:#8a6d25;--steel:#2f5e86;--pos:#1d6f4a;--neg:#a33328}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#17150f!important}
  .sidebar,.topbar,.chips,.stmt-tabs,.print-btn,.ctlrow,.rz-actions{display:none!important}
  .app{display:block!important;min-height:auto!important;grid-template-columns:1fr!important}
  .main{margin:0!important;display:block!important;overflow:visible!important;height:auto!important}
  .content{padding:0 4px!important;max-width:100%!important;overflow:visible!important;height:auto!important}
  .tbl-scroll{overflow:visible!important;max-height:none!important}
  .chartbox{max-width:660px;page-break-inside:avoid}
  canvas{max-width:100%!important}
  .card{background:#fff!important;border:1px solid #c9c5bc!important;box-shadow:none!important;break-inside:avoid}
  .grid{break-inside:avoid}
  .print-head{display:block!important;border-bottom:2px solid #17150f;margin-bottom:18px;padding-bottom:10px}
  .ph-brand{font-family:var(--mono);font-size:10px;letter-spacing:.35em;color:#6e6a5e}
  .ph-title{font-family:var(--display);font-size:22px;font-weight:600;color:#17150f;margin-top:4px}
  .ph-sub{font-family:var(--mono);font-size:11px;color:#6e6a5e;margin-top:2px}
  .kpi .val{color:#17150f!important}
  table.ledger tr.tot td,table.ledger tr.sub td{border-color:#17150f!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

      líquido devido e aluguéis como remuneração de capitais de terceiros (CPC 09).
   3. DMPL — saldo de abertura de 2021 zerado e integralização de capital evidenciada.
   4. Imobilizado / intangível — ativos totalmente depreciados/amortizados mantidos no razão auxiliar.
   5. DRE — resultado operacional (EBIT) explícito. */
const RZ_ANO = (()=>{                       /* débitos e créditos anuais por conta, a partir do Razão */
  const o = {};
  for(const [cod, ls] of Object.entries(DATA.razao.linhas)) for(const l of ls){
    const k = cod+'|'+new Date(Y0,0,1+l[0]).getFullYear();
    const a = o[k] || (o[k] = {d:0, c:0}); a.d += l[4]; a.c += l[5];
  }
  return o;
})();
const rzAno = (cod, y) => RZ_ANO[cod+'|'+y] || {d:0, c:0};
const ABERT = (()=>{                        /* lançamento de abertura (integralização de capital) */
  const iAb = DATA.razao.mod.indexOf('Abertura'), o = {};
  if(iAb < 0) return o;
  for(const [cod, ls] of Object.entries(DATA.razao.linhas)) for(const l of ls)
    if(l[1]===iAb) o[cod] = (o[cod]||0) + l[4] - l[5];
  return o;
})();
const BPV = (y, cod) => { if(!DATA.balanco[y]) return 0; const c = DATA.balanco[y].contas.find(x=>x.cod===cod); return c ? c.v : 0; };
const BPG = (y, pred) => DATA.balanco[y] ? DATA.balanco[y].contas.filter(pred).reduce((a,c)=>a+c.v,0) : 0;
const isCustoANC = c => c.g==='Ativo Não Circulante' && !/\.99$/.test(c.cod);
(function normalizar(){
  YEARS.forEach(y=>{
    const a = DATA.dre[y].annual, p = y-1, ini = y===Y0;
    /* 5 · EBIT */
    a.EBIT = a.Lucro_Bruto + a.Despesas_Operacionais;
    DATA.dre_m[y].EBIT = DATA.dre_m[y].Lucro_Bruto.map((v,i)=>v + DATA.dre_m[y].Despesas_Operacionais[i]);
    /* 1 · DFC indireta reconstruída a partir do Balanço */
    const dlt = cod => BPV(y,cod) - BPV(p,cod);
    const dG = pred => BPG(y,pred) - BPG(p,pred);
    const ncEst = ini ? (ABERT[COD.est]||0) : 0;
    const ncImob = ini ? Object.entries(ABERT).filter(([c])=>/^1\.2\./.test(c)).reduce((s,[,v])=>s+v,0) : 0;
    const dCli = dlt(COD.cli), dEst = dlt(COD.est) - ncEst;
    const dRec = dG(c=>c.cl==='Ativo' && c.s==='Tributos a Recuperar');
    const dForn = dG(c=>c.cl==='Passivo' && c.s==='Fornecedores');
    const dFisc = dG(c=>c.cl==='Passivo' && c.s==='Fiscal');
    const dTrab = dG(c=>c.cl==='Passivo' && c.s==='Trabalhista');
    const capex = dG(isCustoANC) - ncImob;
    const da = Math.abs(a.DA), ll = a.Lucro_Liquido;
    const dwc = -dCli - dEst - dRec + dForn + dFisc + dTrab;
    const oper = ll + da + dwc;
    const fin = dlt(COD.cap) - ncEst - ncImob;            /* integralização em espécie */
    const f = DATA.dfc[y];
    f.ind = {ll, dep:da, dwc, oper, invest:-capex, fin, dCli, dEst, dRec, dForn, dFisc, dTrab,
             naoCaixa:ncEst+ncImob, ncEst, ncImob};
    const irDesp = -a.IRPJ_CSLL, dIR = dlt('2.1.3.04') + dlt('2.1.3.05');
    f.extra.ir_pago = irDesp - dIR;                        /* regime de caixa, não de competência */
    f.extra.trib_consumo = f.extra.trib_pagos - f.extra.ir_pago;
    /* 2 · DVA (CPC 09) */
    const v = DATA.dva[y];
    const credUsados = DATA.imp[y].trib.filter(t=>['ICMS','PIS','COFINS'].includes(t.n)).reduce((s,t)=>s+(t.db-t.vr),0);
    const r = rzAno('5.2.2.01', y), alug = r.d - r.c;
    const receitas = Math.abs(v.receitas), insumos = Math.abs(v.insumos) + credUsados - alug;
    const retencoes = Math.abs(v.retencoes), va_bruto = receitas - insumos, va_liquido = va_bruto - retencoes;
    const juros = Math.abs(v.cap_terceiros);
    DATA.dva[y] = {receitas, insumos, va_bruto, retencoes, va_liquido,
      pessoal:Math.abs(v.pessoal), impostos:Math.abs(v.impostos) - credUsados,
      juros, alugueis:alug, cap_terceiros:juros + alug, retidos:v.retidos, cred_tributos:credUsados};
  });
  /* 3 · DMPL — integralização inicial */
  const capAb = -(ABERT[COD.cap]||0);
  if(capAb > 0.005){
    const d = DATA.dmpl[Y0];
    d.cap_ini = 0; d.integ = capAb;
    d.integ_caixa = ABERT[COD.cx]||0; d.integ_bens = capAb - d.integ_caixa;
  }
  /* 4 · ativos totalmente depreciados/amortizados continuam no auxiliar (custo = depreciação acumulada) */
  ['imob','intang'].forEach(k=>{
    const A = DATA[k];
    YEARS.forEach(y=>{
      const ac = A[y].acum, rs = A[y].resid || (A[y].resid = {});
      A.ativos.forEach(x=>{
        if(x.dt > y+'-12-31' || ac[x.id]!==undefined) return;
        const [yy, mm] = x.dt.split('-').map(Number);
        if((y-yy)*12 + (12-mm) + 1 >= x.vu){ ac[x.id] = x.v; rs[x.id] = 0; }
      });
    });
  });
})();

function prazosBP(y){
  const rb = DATA.dre[y].annual.Receita_Bruta;
  const compras = rzAno('2.1.1.01', y).c;                  /* créditos em Fornecedores = compras a prazo */
  return {pmr: BPV(y,COD.cli)/rb*360, pmp: BPG(y,c=>c.cl==='Passivo'&&c.s==='Fornecedores')/compras*360};
}

/* ---------- exportação CSV universal ---------- */
function tableToCsv(tbl){
  const rows = [];
  tbl.querySelectorAll('tr').forEach(tr=>{
    const cells = [];
    tr.querySelectorAll('th,td').forEach(td=>{
      let t = td.textContent.replace(/\s+/g,' ').trim().replace(/"/g,'""');
      const cs = +(td.getAttribute('colspan')||1);
      cells.push('"'+t+'"');
      for(let i=1;i<cs;i++) cells.push('""');
    });
    if(cells.length) rows.push(cells.join(';'));
  });
  return '\ufeff'+rows.join('\r\n');
}
function dlCsv(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function injectCsvButtons(root){
  root.querySelectorAll('.card').forEach(card=>{
    const tbl = card.querySelector('table.ledger, table.data');
    const h3 = card.querySelector('h3');
    if(!tbl || !h3 || card.querySelector('.csv-mini') || card.querySelector('#rz-csv')) return;
    const btn = document.createElement('button');
    btn.className = 'csv-mini'; btn.textContent = '⬇ CSV';
    btn.title = 'Exportar tabela em CSV (separador ; · Excel pt-BR)';
    btn.addEventListener('click', ()=>{
      const name = (SECTIONS[state.sec].t+' '+(h3.childNodes[0].textContent||'tabela')).trim()
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'_')+'_'+(isAll()?Y0+'-'+YL:state.year)+'.csv';
      dlCsv(name, tableToCsv(tbl));
    });
    h3.appendChild(btn);
  });
}

  document.querySelectorAll('.chips button[data-m]').forEach(b=>b.addEventListener('click',()=>{
    state.month=+b.dataset.m; render();
  }));
  document.querySelectorAll('.chips button[data-mil]').forEach(b=>b.addEventListener('click',()=>{
    state.mil = b.dataset.mil==='1'; render();
  }));
  nrefsPost();
}

/* ---------- Balanço Patrimonial ---------- */
function fav(v, base){ return '<td style="color:var(--dim)">'+(base?pct(v/base):'—')+'</td>'; }
function fah(cur, prev, custo){
  /* análise horizontal sobre o valor apresentado; em linhas de custo/despesa o aumento é desfavorável */
  if(prev===null || prev===undefined || Math.abs(prev)<0.005) return '<td style="color:var(--dim)">—</td>';
  const d = (cur-prev)/Math.abs(prev), fav = custo ? d<=0 : d>=0;
  return '<td class="'+(fav?'vp':'vn')+'" style="font-size:11px">'+(d>=0?'+':'')+pct(d)+'</td>';
}
function bpAccounts(y){
  const d = DATA.balanco[y];
  const by = code => { const c = d.contas.find(c=>c.cod===code); return c?c.v:0; };
  return {d, by};
}
function stmtBP(){
  if(isAll()) return bpComparativo();
  if(isMonth()) return bpMes();
  const {d, by:byRaw} = bpAccounts(state.year);
  const sgn = cod => /^[23]\./.test(cod) ? -1 : 1;
  const by = cod => sgn(cod)*byRaw(cod);
  const grp = (cl,g) => d.contas.filter(c=>c.cl===cl&&c.g===g).map(c=>({...c, v:sgn(c.cod)*c.v}));
  const ac = grp('Ativo','Ativo Circulante'), anc = grp('Ativo','Ativo Não Circulante');
  const pc = grp('Passivo','Passivo Circulante');
  const capital = by(COD.cap), lucros = by(COD.luc);
  const totAC = ac.reduce((a,c)=>a+c.v,0), totANC = anc.reduce((a,c)=>a+c.v,0);
  const totPC = -pc.reduce((a,c)=>a+c.v,0);
  const pl = -capital - lucros + d.resultado_acum;
  const yPrev = state.year>Y0 ? state.year-1 : null;
  const byP = yPrev ? (cod => sgn(cod)*bpAccounts(yPrev).by(cod)) : null;
  const dP = yPrev ? DATA.balanco[yPrev] : null;
  const at = d.total_ativo;
  const prevH = yPrev ? String(yPrev) : '—';
  const head4 = '<tr><th></th><th>'+state.year+' R$</th><th>'+prevH+' R$</th><th>AV %</th><th>AH %</th></tr>';
  const pcell = p => '<td style="color:var(--muted)">'+(p===null?'—':fmc(p))+'</td>';
  const rows = (arr,inv) => arr.map(c=>{
    const v = inv?-c.v:c.v, p = byP ? (inv?-byP(c.cod):byP(c.cod)) : null;
    return '<tr class="ind"><td>'+esc(c.n)+nrefSub(c.s)+'</td><td>'+fmc(v)+'</td>'+pcell(p)+fav(v,at)+fah(v,p)+'</tr>';
  }).join('');
  const trow = (nome, v, p, cls) => '<tr class="'+cls+'"><td>'+nome+'</td><td>'+(cls==='tot'?fm(v):fmc(v))+'</td>'+pcell(p)+fav(v,at)+fah(v,p)+'</tr>';
  const sumP = (cl,g) => dP ? dP.contas.filter(c=>c.cl===cl&&c.g===g).reduce((a,c)=>a+sgn(c.cod)*c.v,0) : null;
  const plP = dP ? -byP(COD.cap) - byP(COD.luc) + dP.resultado_acum : null;
  const ativo =
    '<div class="card"><h3>ATIVO <span class="sub">31/12/'+state.year+' · AV sobre o ativo total · AH vs '+(yPrev||'—')+'</span></h3><div class="tbl-scroll mt"><table class="ledger">'+head4+
    '<tr class="sec"><td colspan="5">Ativo Circulante</td></tr>'+rows(ac)+
    trow('Total do Ativo Circulante', totAC, sumP('Ativo','Ativo Circulante'), 'sub')+
    '<tr class="sec"><td colspan="5">Ativo Não Circulante</td></tr>'+rows(anc)+
    trow('Total do Ativo Não Circulante', totANC, sumP('Ativo','Ativo Não Circulante'), 'sub')+
    trow('TOTAL DO ATIVO', d.total_ativo, dP?dP.total_ativo:null, 'tot')+
    '</table></div></div>';
  const passivo =
    '<div class="card"><h3>PASSIVO E PATRIMÔNIO LÍQUIDO <span class="sub">31/12/'+state.year+' · AV sobre o ativo total · AH vs '+(yPrev||'—')+'</span></h3><div class="tbl-scroll mt"><table class="ledger">'+head4+
    '<tr class="sec"><td colspan="5">Passivo Circulante</td></tr>'+rows(pc,true)+
    trow('Total do Passivo Circulante', totPC, dP?dP.total_passivo:null, 'sub')+
    '<tr class="sec"><td colspan="5">Patrimônio Líquido</td></tr>'+
    trow('Capital Social'+nref(13), -capital, byP?-byP(COD.cap):null, 'ind')+
    trow('Lucros ou Prejuízos Acumulados'+nref(13), -lucros + d.resultado_acum, byP?-byP(COD.luc)+dP.resultado_acum:null, 'ind')+
    trow('Total do Patrimônio Líquido', pl, plP, 'sub')+
    trow('TOTAL DO PASSIVO + PL', totPC+pl, dP?dP.total_passivo+plP:null, 'tot')+
    '</table></div>'+
    '<div class="section-note">Equação patrimonial verificada: Ativo '+compact(d.total_ativo)+' = Passivo + PL '+compact(totPC+pl)+' · diferença R$ 0,00 · N# — referência às Notas Explicativas</div></div>';
  return '<div class="grid g2">'+ativo+passivo+'</div>'+
    '<div class="grid g3 mt"><div class="card"><h3>Evolução do Ativo Total <span class="sub">mensal · '+state.year+'</span></h3>'+
    '<div class="chartbox"><canvas id="ch-bp"></canvas></div></div>'+
    '<div class="card"><h3>Composição do Ativo <span class="sub">12/'+state.year+'</span></h3><div class="chartbox"><canvas id="ch-bp2"></canvas></div></div>'+
    '<div class="card"><h3>Composição do Passivo e PL <span class="sub">12/'+state.year+'</span></h3><div class="chartbox"><canvas id="ch-bp3"></canvas></div></div></div>';
}
function bpMes(){
  const y = state.year, m = state.month;
  const val = cod => { const raw = bpSaldoM(y,cod,m); return /^[23]\./.test(cod) ? -raw : raw; };
  const grp = (cl,g) => BP_META.filter(c=>c.cl===cl&&c.g===g).map(c=>({...c, v:val(c.cod)}));
  const ac = grp('Ativo','Ativo Circulante'), anc = grp('Ativo','Ativo Não Circulante');
  const pc = grp('Passivo','Passivo Circulante');
  const capital = val(COD.cap), lucros = val(COD.luc);
  const resAcum = DATA.res_acum_m[y][m-1];
  const totAC = ac.reduce((a,c)=>a+c.v,0), totANC = anc.reduce((a,c)=>a+c.v,0);
  const totAT = totAC+totANC;
  const totPC = -pc.reduce((a,c)=>a+c.v,0);
  const pl = -capital - lucros + resAcum;
  const ref = mLabel();
  const prevOf = cod => { const raw = m>1 ? bpSaldoM(y,cod,m-1) : (y>Y0 ? bpSaldoM(y-1,cod,12) : null); return raw===null ? null : (/^[23]\./.test(cod) ? -raw : raw); };
  const refPrev = m>1 ? MESES[m-2]+'/'+String(y).slice(2) : (y>Y0 ? 'dez/'+String(y-1).slice(2) : '—');
  const head4 = '<tr><th></th><th>R$</th><th>AV %</th><th>AH %</th></tr>';
  const rows = (arr,inv) => arr.map(c=>{
    const v = inv?-c.v:c.v, p0 = prevOf(c.cod), p = p0===null?null:(inv?-p0:p0);
    return '<tr class="ind"><td>'+esc(c.n)+nrefSub(c.s)+'</td><td>'+fmc(v)+'</td>'+fav(v,totAT)+fah(v,p)+'</tr>';
  }).join('');
  const sumPrev = arr => { let s=0; for(const c of arr){ const p=prevOf(c.cod); if(p===null) return null; s+=p; } return s; };
  const trow = (nome, v, p, cls) => '<tr class="'+cls+'"><td>'+nome+'</td><td>'+(cls==='tot'?fm(v):fmc(v))+'</td>'+fav(v,totAT)+fah(v,p)+'</tr>';
  const pAC = sumPrev(ac), pANC = sumPrev(anc), pPC0 = sumPrev(pc);
  const pCap = prevOf(COD.cap), pLuc = prevOf(COD.luc);
  const pRes = m>1 ? DATA.res_acum_m[y][m-2] : (y>Y0 ? DATA.res_acum_m[y-1][11] : null);
  const pPL = (pCap!==null&&pLuc!==null&&pRes!==null) ? -pCap - pLuc + pRes : null;
  const ativo =
    '<div class="card"><h3>ATIVO <span class="sub">posição '+ref+' · balancete · AH vs '+refPrev+'</span></h3><div class="tbl-scroll mt"><table class="ledger">'+head4+
    '<tr class="sec"><td colspan="4">Ativo Circulante</td></tr>'+rows(ac)+
    trow('Total do Ativo Circulante', totAC, pAC, 'sub')+
    '<tr class="sec"><td colspan="4">Ativo Não Circulante</td></tr>'+rows(anc)+
    trow('Total do Ativo Não Circulante', totANC, pANC, 'sub')+
    trow('TOTAL DO ATIVO', totAT, (pAC!==null&&pANC!==null)?pAC+pANC:null, 'tot')+
    '</table></div></div>';
  const passivo =
    '<div class="card"><h3>PASSIVO E PATRIMÔNIO LÍQUIDO <span class="sub">posição '+ref+' · AH vs '+refPrev+'</span></h3><div class="tbl-scroll mt"><table class="ledger">'+head4+
    '<tr class="sec"><td colspan="4">Passivo Circulante</td></tr>'+rows(pc,true)+
    trow('Total do Passivo Circulante', totPC, pPC0===null?null:-pPC0, 'sub')+
    '<tr class="sec"><td colspan="4">Patrimônio Líquido</td></tr>'+
    trow('Capital Social', -capital, pCap===null?null:-pCap, 'ind')+
    trow('Lucros ou Prejuízos Acumulados', -lucros + resAcum, (pLuc!==null&&pRes!==null)?-pLuc+pRes:null, 'ind')+
    trow('Total do Patrimônio Líquido', pl, pPL, 'sub')+
    trow('TOTAL DO PASSIVO + PL', totPC+pl, (pPC0!==null&&pPL!==null)?-pPC0+pPL:null, 'tot')+
    '</table></div>'+
    '<div class="section-note">Posição intermediária extraída do balancete mensal — resultado do período apurado pelas contas de resultado. Ativo '+compact(totAT)+' = Passivo + PL '+compact(totPC+pl)+' · diferença R$ 0,00</div></div>';
  return '<div class="grid g2">'+ativo+passivo+'</div>'+
    '<div class="grid g3 mt"><div class="card"><h3>Evolução do Ativo Total <span class="sub">mensal · '+y+' · destaque '+ref+'</span></h3>'+
    '<div class="chartbox"><canvas id="ch-bp"></canvas></div></div>'+
    '<div class="card"><h3>Composição do Ativo <span class="sub">'+ref+'</span></h3><div class="chartbox"><canvas id="ch-bp2"></canvas></div></div>'+
    '<div class="card"><h3>Composição do Passivo e PL <span class="sub">'+ref+'</span></h3><div class="chartbox"><canvas id="ch-bp3"></canvas></div></div></div>';
}
function bpComparativo(){
  /* Saldos na natureza de cada grupo: ativo devedor positivo; passivo e PL credores apresentados
     positivos (a base guarda contas credoras com sinal positivo). Contas redutoras do ativo
     — depreciação e amortização acumuladas — permanecem negativas. */
  const codes = DATA.balanco[YL].contas.slice();
  const val = (y,cod) => BPV(y,cod);
  const ncol = YEARS.length + 1;
  const head = '<tr><th>Conta</th>'+YEARS.map(y=>'<th>31/12/'+y+'</th>').join('')+'</tr>';
  const line = (nome, get, cls, ind) => '<tr class="'+(cls||'')+' '+(ind?'ind':'')+'"><td>'+nome+'</td>'+
    YEARS.map(y=>'<td>'+(cls==='tot'?fm(get(y)):fmc(get(y)))+'</td>').join('')+'</tr>';
  const sumG = (y,cl,g) => BPG(y, c=>c.cl===cl && c.g===g);
  const capital = y => val(y,COD.cap);
  const lucros = y => val(y,COD.luc) + DATA.balanco[y].resultado_acum;
  const totPL = y => capital(y) + lucros(y);
  const totPC = y => sumG(y,'Passivo','Passivo Circulante');
  const grupo = (cl, g) => codes.filter(c=>c.cl===cl && c.g===g).map(c=>line(esc(c.n)+nrefSub(c.s), y=>val(y,c.cod), '', true)).join('');
  let h = '<tr class="sec"><td colspan="'+ncol+'">Ativo Circulante</td></tr>' + grupo('Ativo','Ativo Circulante');
  h += line('Total do Ativo Circulante', y=>sumG(y,'Ativo','Ativo Circulante'), 'sub');
  h += '<tr class="sec"><td colspan="'+ncol+'">Ativo Não Circulante</td></tr>' + grupo('Ativo','Ativo Não Circulante');
  h += line('Total do Ativo Não Circulante', y=>sumG(y,'Ativo','Ativo Não Circulante'), 'sub');
  h += line('TOTAL DO ATIVO', y=>DATA.balanco[y].total_ativo, 'tot');
  h += '<tr class="sec"><td colspan="'+ncol+'">Passivo Circulante</td></tr>' + grupo('Passivo','Passivo Circulante');
  h += line('Total do Passivo Circulante', totPC, 'sub');
  h += '<tr class="sec"><td colspan="'+ncol+'">Patrimônio Líquido</td></tr>';
  h += line('Capital Social'+nref(13), capital, '', true);
  h += line('Lucros ou Prejuízos Acumulados'+nref(13), lucros, '', true);
  h += line('Total do Patrimônio Líquido', totPL, 'sub');
  h += line('TOTAL DO PASSIVO + PL', y=>totPC(y) + totPL(y), 'tot');
  const difMax = Math.max(...YEARS.map(y=>Math.abs(DATA.balanco[y].total_ativo - totPC(y) - totPL(y))));
  return '<div class="card"><h3>Balanço Patrimonial Comparativo <span class="sub">'+Y0+'–'+YL+' · R$ · posições de 31 de dezembro</span></h3>'+
    '<div class="tbl-scroll mt"><table class="ledger">'+head+h+'</table></div>'+
    '<div class="section-note">Passivo e patrimônio líquido apresentados pelos saldos credores (positivos); depreciação e amortização acumuladas aparecem entre parênteses como contas redutoras do ativo. Equação patrimonial verificada em todos os exercícios: Ativo = Passivo + PL · maior diferença '+(difMax<0.005?'R$ 0,00 ✓':money(difMax))+'.</div></div>'+
    '<div class="grid g2 mt"><div class="card"><h3>Ativo Total <span class="sub">fechamento anual</span></h3><div class="chartbox"><canvas id="ch-bp"></canvas></div></div>'+
    '<div class="card"><h3>Estrutura de capital <span class="sub">Passivo vs PL</span></h3><div class="chartbox"><canvas id="ch-bp2"></canvas></div></div></div>';
}

      pointRadius:MESES.map((_,i)=>isMonth()&&i===m-1?5:2.5),

      pointBorderWidth:MESES.map((_,i)=>isMonth()&&i===m-1?2:1),borderWidth:2}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:ttipDefault},scales:{x:axCat(),y:axMoney()}}});
    const g = {};

    } else {
      const {d} = bpAccounts(state.year);
      d.contas.filter(c=>c.cl==='Ativo').forEach(c=>{ g[c.s]=(g[c.s]||0)+c.v; });

    const ent = Object.entries(g).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    mkChart('ch-bp2',{type:'doughnut',data:{labels:ent.map(e=>e[0]),datasets:[{data:ent.map(e=>e[1]),
      backgroundColor:PAL,borderColor:'#12151C',borderWidth:2}]},
      options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:legendOpt('right'),tooltip:ttipDefault}}});
    /* composição do passivo + PL */
    const gp = {};
    if(isMonth()){
      const m = state.month;
      /* contas credoras guardadas com saldo positivo na base */
      BP_META.filter(c=>c.cl==='Passivo').forEach(c=>{ gp[c.s]=(gp[c.s]||0)+bpSaldoM(state.year,c.cod,m); });
      gp['Capital Social'] = bpSaldoM(state.year,COD.cap,m);
      gp['Lucros Acumulados'] = bpSaldoM(state.year,COD.luc,m) + DATA.res_acum_m[state.year][m-1];
    } else {
      const {d:db} = bpAccounts(state.year);
      db.contas.filter(c=>c.cl==='Passivo').forEach(c=>{ gp[c.s]=(gp[c.s]||0)+c.v; });
      const byP = code => { const c = db.contas.find(x=>x.cod===code); return c?c.v:0; };
      gp['Capital Social'] = byP(COD.cap);
      gp['Lucros Acumulados'] = byP(COD.luc) + db.resultado_acum;
    }
    const entP = Object.entries(gp).filter(([,v])=>Math.abs(v)>0.5).sort((a,b)=>b[1]-a[1]);
    mkChart('ch-bp3',{type:'doughnut',data:{labels:entP.map(e=>e[0]),datasets:[{data:entP.map(e=>Math.abs(e[1])),

      options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:legendOpt('right'),tooltip:{...ttip,callbacks:{label:c=>{
        const raw = entP[c.dataIndex][1];
        return ' '+c.label+': '+(raw<0?'('+money(Math.abs(raw)).slice(3)+')':money(raw));
      }}}}}});
  }
}

      }).join('')+'</table>';
  } else {
    const a = DATA.dre[state.year].annual;
    const aP = state.year>Y0 ? DATA.dre[state.year-1].annual : null;
    const rlAbs = a.Receita_Liquida;
    const prevH = aP ? String(state.year-1)+' · R$' : '—';
    table = '<table class="ledger"><tr><th></th><th>'+state.year+' · R$</th><th>'+prevH+'</th><th>AV %</th><th>AH %</th></tr>'+
      dreLines().map(([n,k,cls])=>{
        const v = sign(k)*a[k], vP = aP ? sign(k)*aP[k] : null;
        return '<tr class="'+cls+'"><td>'+n+'</td><td>'+fmc(v)+'</td><td style="color:var(--muted)">'+(vP===null?'—':fmc(vP))+'</td><td style="color:var(--dim)">'+pct(a[k]/rlAbs*sign(k))+'</td>'+fah(v, vP, sign(k)<0)+'</tr>';
      }).join('')+'</table>';
  }
  const despCard = despesasCard();
  const funcCard = isMonth() ? '' : dreFuncaoCard();
  return '<div class="grid g23"><div class="card"><h3>Demonstração do Resultado do Exercício <span class="sub">'+(isMonth()?mLabel():yearLabel())+' · regime de competência</span></h3>'+
    '<div class="tbl-scroll mt">'+table+'</div></div>'+despCard+'</div>'+

    '<div class="grid g2 mt">'+
    '<div class="card"><h3>Receita Líquida × Resultado <span class="sub">'+(isAll()?'anual':'mensal · '+state.year)+'</span></h3><div class="chartbox tall"><canvas id="ch-dre1"></canvas></div></div>'+

}
function despesasCard(){

/* ---------- DFC ---------- */
function dfcAgg(){
  if(!isAll()) return DATA.dfc[state.year];
  const o = {ent:sumYears(y=>DATA.dfc[y].ent), sai:sumYears(y=>DATA.dfc[y].sai), liq:sumYears(y=>DATA.dfc[y].liq),
    caixa_ini:DATA.dfc[Y0].caixa_ini, caixa_fim:DATA.dfc[YL].caixa_fim,
    ind:{}};
  Object.keys(DATA.dfc[Y0].ind).forEach(k=>{ o.ind[k] = sumYears(y=>DATA.dfc[y].ind[k]); });
  return o;
}
function dfcExtra(k){ return isAll() ? sumYears(y=>DATA.dfc[y].extra[k]) : DATA.dfc[state.year].extra[k]; }
function dfcDiretoMod(){
  const acc = {};
  const ys = isAll()?YEARS:[state.year];
  ys.forEach(y=>(DATA.concil[y].mod||[]).forEach(m=>{
    if(!acc[m.n]) acc[m.n]={e:0,s:0};
    acc[m.n].e += m.e; acc[m.n].s += m.s;
  }));
  return acc;
}
function stmtDFC(){
  if(isMonth()) return dfcMes();
  const d = dfcAgg(); const i = d.ind;
  const M = dfcDiretoMod();
  const g = n => M[n] || {e:0,s:0};
  const receb = g('Contas a Receber').e + g('Recebimento Cliente').e;
  const forn = g('Contas a Pagar').s + g('Pagamento Fornecedor').s;
  const pessoal = g('Folha').s + g('Pagamento Folha').s;
  const trib = g('Fiscal').s + g('Pagamento Tributos').s;
  const aporte = g('Abertura').e;
  const MAPPED = ['Contas a Receber','Recebimento Cliente','Contas a Pagar','Pagamento Fornecedor',
                  'Folha','Pagamento Folha','Fiscal','Pagamento Tributos','Abertura'];
  let outrosE = 0, outrosS = 0;
  Object.keys(M).forEach(n => { if(!MAPPED.includes(n)){ outrosE += M[n].e; outrosS += M[n].s; } });
  /* capex liquidado via contas a pagar: reclassificado para atividades de investimento (CPC 03, item 16) */
  const capexCx = -i.invest;
  const fornOper = forn - capexCx;
  const operDir = receb - fornOper - pessoal - trib + outrosE - outrosS;
  const varTot = operDir - capexCx + aporte;
  const outrosRows =
    (Math.abs(outrosE)>0.005 ? '<tr class="ind"><td>(+) Outros recebimentos operacionais</td><td>'+fm(outrosE)+'</td></tr>' : '')+
    (Math.abs(outrosS)>0.005 ? '<tr class="ind"><td>(−) Outros pagamentos operacionais</td><td>'+fm(-outrosS)+'</td></tr>' : '');
  const direta = '<table class="ledger"><tr><th></th><th>'+yearLabel()+' · R$</th></tr>'+
    '<tr class="sec"><td colspan="2">Atividades operacionais</td></tr>'+
    '<tr class="ind"><td>(+) Recebimentos de clientes</td><td>'+fm(receb)+'</td></tr>'+
    '<tr class="ind"><td>(−) Pagamentos a fornecedores de mercadorias e serviços</td><td>'+fm(-fornOper)+'</td></tr>'+
    '<tr class="ind"><td>(−) Pagamentos de pessoal e encargos</td><td>'+fm(-pessoal)+'</td></tr>'+
    '<tr class="ind"><td>(−) Tributos pagos — ICMS, PIS, COFINS, IRPJ e CSLL</td><td>'+fm(-trib)+'</td></tr>'+
    outrosRows+
    '<tr class="sub"><td>Caixa líquido das atividades operacionais</td><td>'+fmc(operDir)+'</td></tr>'+
    '<tr class="sec"><td colspan="2">Atividades de investimento</td></tr>'+
    '<tr class="ind"><td>(−) Aquisições de imobilizado e intangível</td><td>'+fmc(-capexCx)+'</td></tr>'+
    '<tr class="sec"><td colspan="2">Atividades de financiamento</td></tr>'+

/* ===================== REAL × BUDGET × FORECAST ===================== */
function budAgg(){
  if(!isAll()){
    const b = DATA.budget[state.year];
    const s = a => a.reduce((x,v)=>x+v,0);
    return {rec_r:s(b.rec_r), rec_b:s(b.rec_b), rec_f:s(b.rec_f), ll_r:s(b.ll_r), ll_b:s(b.ll_b), ll_f:s(b.ll_f)};
  }
  const s = k => sumYears(y=>DATA.budget[y][k].reduce((a,v)=>a+v,0));
  return {rec_r:s('rec_r'), rec_b:s('rec_b'), rec_f:s('rec_f'), ll_r:s('ll_r'), ll_b:s('ll_b'), ll_f:s('ll_f')};
}
function varCell(v, base){
  const p = base ? v/Math.abs(base) : 0;
  const cls = v>=0 ? 'vp' : 'vn';
  return '<td class="'+cls+'">'+fmc(v)+'</td><td class="'+cls+'" style="font-size:10px">'+(v>=0?'+':'−')+pct(Math.abs(p))+'</td>';
}
function renderBudget(){
  const a = budAgg();
  const dRec = a.rec_r - a.rec_b, dLL = a.ll_r - a.ll_b;
  const atg = a.rec_r/a.rec_b;
  const kpis = '<div class="grid g4">'+
    kpi('Receita Real · '+yearLabel(), compact(a.rec_r), 'brass', 'Budget '+compact(a.rec_b))+
    kpi('Δ Receita vs Budget', compact(dRec), dRec>=0?'pos':'neg', 'Atingimento '+pct(atg))+
    kpi('Resultado Real', compact(a.ll_r), a.ll_r>=0?'pos':'neg', 'Budget '+compact(a.ll_b))+
    kpi('Δ Resultado vs Budget', compact(dLL), dLL>=0?'pos':'neg', 'Forecast '+compact(a.ll_f))+
  '</div>';
  let table;
  if(isAll()){
    const rows = YEARS.map(y=>{
      const b = DATA.budget[y], s = a2 => a2.reduce((x,v)=>x+v,0);
      const rr=s(b.rec_r), rb=s(b.rec_b), lr=s(b.ll_r), lb=s(b.ll_b);
      return '<tr><td>'+y+'</td><td>'+fm(rb)+'</td><td>'+fm(rr)+'</td>'+varCell(rr-rb,rb)+
        '<td>'+fmc(lb)+'</td><td>'+fmc(lr)+'</td>'+varCell(lr-lb,lb)+'</tr>';
    }).join('');
    table = '<table class="data"><tr><th>Exercício</th><th>Receita Budget</th><th>Receita Real</th><th colspan="2">Δ Receita</th>'+
      '<th>Result. Budget</th><th>Result. Real</th><th colspan="2">Δ Resultado</th></tr>'+rows+'</table>';
  } else {
    const b = DATA.budget[state.year];
    const rows = MESES.map((n,i)=>{
      return '<tr><td>'+n+'/'+state.year+'</td><td>'+fm(b.rec_b[i])+'</td><td>'+fm(b.rec_f[i])+'</td><td>'+fm(b.rec_r[i])+'</td>'+varCell(b.rec_r[i]-b.rec_b[i], b.rec_b[i])+
        '<td>'+fmc(b.ll_b[i])+'</td><td>'+fmc(b.ll_r[i])+'</td>'+varCell(b.ll_r[i]-b.ll_b[i], b.ll_b[i])+'</tr>';
    }).join('');
    table = '<table class="data"><tr><th>Competência</th><th>Rec. Budget</th><th>Rec. Forecast</th><th>Rec. Real</th><th colspan="2">Δ vs Budget</th>'+
      '<th>Result. Budget</th><th>Result. Real</th><th colspan="2">Δ vs Budget</th></tr>'+rows+'</table>';
  }
  return kpis+
    '<div class="grid g2 mt"><div class="card"><h3>Receita Líquida <span class="sub">real × budget × forecast · '+yearLabel()+'</span></h3>'+
    '<div class="chartbox tall"><canvas id="ch-bud1"></canvas></div></div>'+
    '<div class="card"><h3>Resultado Líquido <span class="sub">real × budget · '+yearLabel()+'</span></h3>'+
    '<div class="chartbox tall"><canvas id="ch-bud2"></canvas></div></div></div>'+
    '<div class="card mt"><h3>Acompanhamento orçamentário <span class="sub">'+(isAll()?'consolidado anual':'mensal · '+state.year)+'</span></h3>'+
    '<div class="mt tbl-scroll">'+table+'</div>'+
    '<div class="section-note">Variações favoráveis em verde, desfavoráveis em vermelho — Δ% sobre o valor orçado. Forecast: revisão de projeção na data-base de cada competência.</div></div>';
}

/* ===================== RAZÃO CONTÁBIL ===================== */
const RZ_BASE = new Date(Y0,0,1);
function rzDate(off){ const d = new Date(Y0,0,1+off); return d; }
function rzDateStr(off){
  const d = rzDate(off);
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function rzComp(off){ const d = rzDate(off); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function rzDefaults(){
  if(isAll()) return [Y0+'-01', YL+'-'+String(lastM(YL)).padStart(2,'0')];
  return [state.year+'-01', state.year+'-12'];
}
function rzRange(){
  const [d0,a0] = rzDefaults();
  let de = state.rzDe || d0, ate = state.rzAte || a0;
  if(de > ate){ const t = de; de = ate; ate = t; }
  return [de, ate];
}
function renderRazao(){
  const contas = DATA.razao.contas;
  const [de, ate] = rzRange();
  const meta = contas.find(c=>c.cod===state.rzConta) || contas[0];
  state.rzConta = meta.cod;
  const linhas = DATA.razao.linhas[meta.cod] || [];
  /* saldo anterior + linhas do período */
  let saldoAnt = 0, totD = 0, totC = 0;
  const per = [];
  for(const r of linhas){
    const comp = rzComp(r[0]);
    if(comp < de){ saldoAnt += r[4]-r[5]; }
    else if(comp <= ate){ per.push(r); totD += r[4]; totC += r[5]; }
  }
  const saldoFim = saldoAnt + totD - totC;
  const dc = v => v > 0.004 ? '<span class="dc">D</span>' : (v < -0.004 ? '<span class="dc">C</span>' : '');
  const fs = v => fm(Math.abs(v)) + dc(v);
  /* controles */
  const optC = contas.map(c=>'<option value="'+c.cod+'"'+(c.cod===meta.cod?' selected':'')+'>'+c.cod+' · '+esc(c.n)+'</option>').join('');
  const optP = sel => COMPS.map(c=>'<option value="'+c+'"'+(c===sel?' selected':'')+'>'+compLabel(c)+'</option>').join('');
  const ctl = '<div class="card"><div class="ctlrow">'+
    '<div class="fld" style="flex:1;min-width:260px"><div class="eyebrow">Conta contábil</div><select class="sel" id="rz-conta">'+optC+'</select></div>'+
    '<div class="fld"><div class="eyebrow">Competência de</div><select class="sel" id="rz-de">'+optP(de)+'</select></div>'+
    '<div class="fld"><div class="eyebrow">Competência até</div><select class="sel" id="rz-ate">'+optP(ate)+'</select></div>'+
    '<div class="fld rz-actions"><div class="eyebrow">&nbsp;</div><button class="print-btn" id="rz-csv" title="Baixar o razão do período filtrado em CSV">⬇&nbsp;Exportar CSV</button></div>'+
    '</div>'+
    '<div class="section-note" style="margin-top:0">Classe: '+esc(meta.cl)+' · natureza '+(meta.nat==='D'?'devedora':'credora')+' · '+linhas.length+' partidas na conta · período segue o filtro de ano e pode ser ajustado acima.</div></div>';
  const kpis = '<div class="grid g4 mt">'+
    kpi('Saldo anterior · até '+compLabel(de), fs(saldoAnt), '', 'Acumulado desde a abertura')+
    kpi('Débitos no período', compact(totD), 'pos', per.length+' partidas no período')+
    kpi('Créditos no período', compact(totC), 'neg', compLabel(de)+' – '+compLabel(ate))+
    kpi('Saldo final · '+compLabel(ate), fs(saldoFim), 'brass', meta.nat==='D'?'Natureza devedora':'Natureza credora')+
  '</div>';
  /* tabela */
  const MAXR = 420;
  let run = saldoAnt;
  const shown = per.slice(0, MAXR);
  const rows = shown.map(r=>{
    run += r[4]-r[5];
    return '<tr><td style="white-space:nowrap">'+rzDateStr(r[0])+'</td>'+
      '<td>'+esc(DATA.razao.mod[r[1]])+'</td>'+
      '<td style="font-size:10.5px;color:var(--muted)">'+esc(DATA.razao.docs[r[2]])+'</td>'+
      '<td>'+esc(DATA.razao.hist[r[3]])+'</td>'+
      '<td>'+(r[4]?fm(r[4]):'–')+'</td>'+
      '<td>'+(r[5]?fm(r[5]):'–')+'</td>'+
      '<td>'+fs(run)+'</td></tr>';
  }).join('');
  const capNote = per.length > MAXR ?
    '<div class="section-note">Exibindo as primeiras '+MAXR+' de '+per.length+' partidas do período — refine o intervalo de competências para ver o restante. Totais e saldos consideram o período completo.</div>' : '';
  const abertura = '<tr style="background:rgba(201,165,87,.05)"><td>'+ (de===Y0+'-01' ? '01/01/'+Y0 : '01/'+de.slice(5,7)+'/'+de.slice(0,4)) +'</td><td colspan="3" style="color:var(--dim);font-style:italic">Saldo anterior transportado</td><td>–</td><td>–</td><td>'+fs(saldoAnt)+'</td></tr>';
  const table = '<div class="card mt"><h3>Livro Razão — '+meta.cod+' · '+esc(meta.n)+' <span class="sub">'+compLabel(de)+' a '+compLabel(ate)+'</span></h3>'+
    '<div class="mt tbl-scroll" style="max-height:560px;overflow-y:auto"><table class="data"><tr><th>Data</th><th>Módulo</th><th>Documento</th><th>Histórico</th><th>Débito</th><th>Crédito</th><th>Saldo</th></tr>'+
    abertura+rows+
    '<tr style="border-top:2px solid var(--line2);font-weight:600"><td colspan="4">Totais do período + saldo final</td><td>'+fm(totD)+'</td><td>'+fm(totC)+'</td><td>'+fs(saldoFim)+'</td></tr>'+
    '</table></div>'+capNote+'</div>';
  const chart = '<div class="card mt"><h3>Evolução do saldo <span class="sub">'+meta.cod+' · por competência</span></h3><div class="chartbox"><canvas id="ch-rz"></canvas></div></div>';
  return ctl + kpis + table + chart;
}
function razaoCSV(){
  const [de, ate] = rzRange();
  const meta = DATA.razao.contas.find(c=>c.cod===state.rzConta);
  const linhas = DATA.razao.linhas[state.rzConta] || [];
  const num = v => v.toFixed(2).replace('.',',');
  let saldoAnt = 0; const per = [];
  for(const r of linhas){
    const comp = rzComp(r[0]);
    if(comp < de) saldoAnt += r[4]-r[5];
    else if(comp <= ate) per.push(r);
  }
  const head = ['Data','Competencia','Modulo','Documento','Historico','Debito','Credito','Saldo'];
  const out = ['\uFEFF'+head.join(';')];
  out.push(['','','','','Saldo anterior transportado','','',num(saldoAnt)].join(';'));
  let run = saldoAnt, totD = 0, totC = 0;
  for(const r of per){
    run += r[4]-r[5]; totD += r[4]; totC += r[5];
    const txt = s => '"'+String(s).replace(/"/g,'""')+'"';
    out.push([rzDateStr(r[0]), rzComp(r[0]), txt(DATA.razao.mod[r[1]]), txt(DATA.razao.docs[r[2]]),
      txt(DATA.razao.hist[r[3]]), num(r[4]), num(r[5]), num(run)].join(';'));
  }
  out.push(['','','','','Totais do periodo', num(totD), num(totC), num(run)].join(';'));
  const blob = new Blob([out.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'razao_'+state.rzConta.replace(/\./g,'-')+'_'+de+'_a_'+ate+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function postRazao(){
  const bind = (id, fn) => { const el = document.getElementById(id); if(el) el.addEventListener('change', e=>{ fn(e.target.value); render(); }); };
  bind('rz-conta', v=>{ state.rzConta = v; });
  bind('rz-de', v=>{ state.rzDe = v; });
  bind('rz-ate', v=>{ state.rzAte = v; });
  const csvBtn = document.getElementById('rz-csv');
  if(csvBtn) csvBtn.addEventListener('click', razaoCSV);
  /* série do saldo por competência dentro do período */
  const [de, ate] = rzRange();
  const linhas = DATA.razao.linhas[state.rzConta] || [];
  const comps = COMPS.filter(c=>c>=de && c<=ate);
  let saldo = 0; const idx = {}; comps.forEach((c,i)=>idx[c]=i);
  const serie = new Array(comps.length).fill(null);
  for(const r of linhas){
    const comp = rzComp(r[0]);
    if(comp < de) saldo += r[4]-r[5];
  }
  let run = saldo;
  const porComp = {};
  for(const r of linhas){
    const comp = rzComp(r[0]);
    if(comp>=de && comp<=ate) porComp[comp] = (porComp[comp]||0) + r[4]-r[5];
  }
  comps.forEach((c,i)=>{ run += porComp[c]||0; serie[i] = run; });
  mkChart('ch-rz',{type:'line',data:{labels:comps.map(compLabel),datasets:[{label:'Saldo',data:serie,
    borderColor:C.brass,backgroundColor:C.brassA,fill:true,tension:.3,pointRadius:comps.length>24?0:2.5,pointBackgroundColor:C.brass,borderWidth:2}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:ttipDefault},scales:{x:{...axCat(),ticks:{maxTicksLimit:14}},y:axMoney()}}});
}

/* ===================== INDICADORES ECONÔMICO-FINANCEIROS ===================== */
function indCalc(y){
  const b = DATA.balanco[y];
  const val = cod => { const c = b.contas.find(x=>x.cod===cod); return c?c.v:0; };
  const AC = b.contas.filter(c=>c.cl==='Ativo'&&c.g==='Ativo Circulante').reduce((a,c)=>a+c.v,0);
  const ANC = b.contas.filter(c=>c.cl==='Ativo'&&c.g==='Ativo Não Circulante').reduce((a,c)=>a+c.v,0);
  const ativo = b.total_ativo;
  const PC = b.total_passivo;              /* só passivo circulante no modelo */
  const PL = b.pl + b.resultado_acum;
  const est = val(COD.est), cx = val(COD.cx);
  const dre = DATA.dre[y].annual;
  const RL = dre.Receita_Liquida, LL = dre.Lucro_Liquido, LB = dre.Lucro_Bruto;
  const EBIT = dre.LAIR - dre.Resultado_Financeiro;
  const depam = DATA.despesas_sub[y].filter(d=>['Depreciação','Amortização'].includes(d.n)).reduce((a,d)=>a+d.v,0);
  const EBITDA = EBIT + depam;
  const giroEst = DATA.estoque[y].giro;
  /* prazos pelos saldos do Balanço — o razão auxiliar de CR/CP não concilia com as contas controle */
  const {pmr, pmp} = prazosBP(y);
  const pme = 360/giroEst;
  return {
    /* liquidez */
    liqCorrente: AC/PC, liqSeca: (AC-est)/PC, liqImediata: cx/PC, liqGeral: AC/PC,
    ccl: AC-PC,
    /* endividamento / estrutura */
    endGeral: PC/ativo, partTerceiros: PC/PL, compEndiv: 1, imobPL: ANC/PL,
    /* rentabilidade */
    mgBruta: LB/RL, mgEbitda: EBITDA/RL, mgOper: EBIT/RL, mgLiq: LL/RL,
    roa: LL/ativo, roe: LL/PL, giroAtivo: RL/ativo, alav: ativo/PL,
    ebit: EBIT, ebitda: EBITDA,
    /* atividade */
    pmr, pmp, pme, giroEst, cicloOp: pmr+pme, cicloFin: pmr+pme-pmp,
    AC, PC, PL, ativo, est, cx, RL, LL
  };
}

/* ===================== PAINEL DE CONTROLADORIA ===================== */
/* Modelo gerencial: custos variáveis = CMV + fretes/logística + comercial (sobre a RL);
   custos fixos = demais despesas operacionais + despesas financeiras.
   Capital de giro pelo modelo Fleuriet: CCL, NCG e saldo de tesouraria. */
function ctrlCalc(y){
  const dre = DATA.dre[y].annual;
  const sub = Object.fromEntries(DATA.despesas_sub[y].map(d=>[d.n,d.v]));
  const RL = dre.Receita_Liquida, LL = dre.Lucro_Liquido;
  /* custos em valor absoluto: na DRE os custos e despesas estão com sinal negativo; no quadro de natureza, positivos */
  const semiVar = (sub['Logística']||0) + (sub['Comercial']||0);
  const varTot = Math.abs(dre.CMV_Custos) + semiVar;
  const fixTot = Math.abs(dre.Despesas_Operacionais) - semiVar - dre.Resultado_Financeiro;
  const MC = RL - varTot, mcPct = MC/RL;
  const pe = mcPct>0 ? fixTot/mcPct : Infinity;  /* ponto de equilíbrio contábil (em RL) */
  const ms = (RL-pe)/RL;                          /* margem de segurança */
  const depam = (sub['Depreciação']||0)+(sub['Amortização']||0);
  const EBITDA = (dre.LAIR - dre.Resultado_Financeiro) + depam;
  /* Fleuriet */
  const b = DATA.balanco[y];
  const val = cod => { const c = b.contas.find(x=>x.cod===cod); return c?c.v:0; };
  const AC = b.contas.filter(c=>c.cl==='Ativo'&&c.g==='Ativo Circulante').reduce((a,c)=>a+c.v,0);
  const PC = b.total_passivo;
  const cx = val(COD.cx);
  const acOper = AC - cx;                          /* ativo circulante operacional */
  const pcOper = PC;                               /* sem dívida onerosa no modelo */
  const NCG = acOper - pcOper;
  const CCL = AC - PC;
  const T = CCL - NCG;                             /* = disponibilidades */
  const oper = DATA.dfc[y].ind.oper;
  const folha = DATA.folha[y].tot.Custo_Total, hc = DATA.folha[y].hc;
  const I = indCalc(y);
  return {RL, LL, MC, mcPct, varTot, fixTot, pe, ms, EBITDA, mgEbitda:EBITDA/RL, depam,
    ir:dre.IRPJ_CSLL, resFin:dre.Resultado_Financeiro, lair:dre.LAIR, ebit:dre.LAIR - dre.Resultado_Financeiro,
    NCG, CCL, T, oper, folha, hc, recHc:RL/hc, folhaRL:folha/RL,
    pmr:I.pmr, pme:I.pme, pmp:I.pmp, cicloFin:I.cicloFin, giroEst:I.giroEst, roe:I.roe, liqCorrente:I.liqCorrente};
}

    ', com resultado de '+b(compact(K.LL))+'. '+(K.LL<0
    ? 'O prejuízo decorre de alavancagem operacional negativa: a estrutura fixa de '+b(compact(K.fixTot))+(gFix!==null?' cresceu '+pct(Math.abs(gFix)):'')+' enquanto a receita '+(gRec!==null&&gRec<0?'recuou '+pct(Math.abs(gRec)):'não acompanhou')+' — cada real de receita perdida retira ~'+pct(K.mcPct)+' de margem de contribuição sem alívio equivalente nos fixos.'

  /* 2 — ponto de equilíbrio */
  obs.push('O ponto de equilíbrio contábil está em '+b(compact(K.pe))+' de receita anual. '+(K.ms>=0
    ? (K.ms<0.10

      : 'A margem de segurança é de '+b(pct(K.ms))+' — a receita pode recuar nessa proporção antes de o resultado operacional ficar negativo.')
    : 'A receita atual está '+b(pct(Math.abs(K.ms)))+' ABAIXO do equilíbrio — a operação queima margem: é preciso recompor volume/preço ou reduzir a estrutura fixa.'));

    (K.cicloFin>0

      : ' — os prazos obtidos de fornecedores cobrem todo o ciclo operacional, uma dependência de crédito comercial que precisa ser monitorada.')+
    (K.pmr>90?' O PMR elevado, com saldo de clientes crescente no Balanço, pede revisão da política de crédito e cobrança.':''));
  /* 4 — folha e produtividade */
  const g25folha = K25.folha/K21.folha-1, g25rec = K25.RL/K21.RL-1;

function simCard(y){
  const sl = (id,lab) => '<div class="sim-ctl"><label><span>'+lab+'</span><b id="'+id+'-v">0%</b></label>'+
    '<input type="range" id="'+id+'" min="-30" max="30" step="1" value="0"></div>';
  return '<div class="card mt"><h3>Simulador de cenários <span class="sub">'+y+' · e se…? · elasticidade do resultado</span></h3>'+
    '<div class="sim-grid mt"><div>'+
    sl('sim-rec','Δ Receita (volume/preço)')+
    sl('sim-var','Δ Custos variáveis (unitário)')+
    sl('sim-fix','Δ Custos fixos')+
    '<div class="section-note">Variáveis acompanham o volume automaticamente; o ajuste acima é sobre o custo unitário (negociação de compra, frete, comissão). Resultado simulado antes de efeito fiscal.</div>'+
    '</div><div class="sim-out"><table id="sim-out"></table></div></div></div>';
}
function simWire(y){
  const K = ctrlCalc(y);
  const $ = id => document.getElementById(id);
  const upd = ()=>{
    const dr = +$('sim-rec').value/100, dv = +$('sim-var').value/100, df = +$('sim-fix').value/100;
    $('sim-rec-v').textContent = (dr>=0?'+':'')+Math.round(dr*100)+'%';
    $('sim-var-v').textContent = (dv>=0?'+':'')+Math.round(dv*100)+'%';
    $('sim-fix-v').textContent = (df>=0?'+':'')+Math.round(df*100)+'%';
    const RLs = K.RL*(1+dr), varS = K.varTot*(1+dr)*(1+dv), fixS = K.fixTot*(1+df);
    const MCs = RLs-varS, mcS = MCs/RLs, pes = fixS/mcS, mss = (RLs-pes)/RLs;
    const dOp = (MCs-fixS)-(K.MC-K.fixTot), LLs = K.LL + dOp;
    const row = (l,v,base,fmt)=>{
      const d = v-base, cls = Math.abs(d)<0.005?'':(d>0?'vp':'vn');
      return '<tr><td>'+l+'</td><td class="'+cls+'">'+fmt(v)+(Math.abs(d)>=0.005?' <span style="font-size:10px;opacity:.75">('+(d>0?'+':'−')+fmt(Math.abs(d)).replace('R$ ','')+')</span>':'')+'</td></tr>';
    };
    $('sim-out').innerHTML =
      row('Receita líquida simulada', RLs, K.RL, compact)+
      row('Margem de contribuição', mcS, K.mcPct, pct)+
      row('Ponto de equilíbrio', pes, K.pe, compact)+
      '<tr><td>Margem de segurança</td><td class="'+(mss>=0.1?'vp':mss>=0?'':'vn')+'">'+pct(mss)+'</td></tr>'+
      row('Resultado simulado', LLs, K.LL, compact);
  };
  ['sim-rec','sim-var','sim-fix'].forEach(id=>{ const el=$(id); if(el) el.addEventListener('input', upd); });
  upd();
}

const FPA_SCEN_LABEL = {pess:'Pessimista', base:'Base', otim:'Otimista', custom:'Personalizado'};

function fpaLineNames(){
  return {rec: DATA.fpa_rec.map(l=>l.n),
          desp: DATA.despesas_sub[YL].filter(l=>!['Depreciação','Amortização'].includes(l.n)).map(l=>l.n)};
}
function fpaSeed(s){
  const sh = FPA_SHAPES[s], N = fpaLineNames();
  const rec = {}, desp = {};
  N.rec.forEach(n => rec[n] = [...sh.rev]);
  N.desp.forEach(n => {
    if(n === 'Pessoal') desp[n] = [...sh.pessoal];
    else if(FPA_VAR.includes(n)) desp[n] = [...sh.rev];
    else if(n === 'Não Dedutível') desp[n] = [0,0,0];
    else desp[n] = [...sh.fixo];
  });
  return {rec, desp};
}
const FPA = {scen:'base', drv:{...FPA_SLIDERS.base}, lines:null, charts:{}};

function fpaAnchors(){
  const a = DATA.dre[YL].annual;
  const b = DATA.balanco[YL];
  const by = cod => { const c = b.contas.find(c=>c.cod===cod); return c?c.v:0; };
  const ncg = by(COD.cli) + by(COD.est) - by('2.1.1.01');
  const recL = DATA.fpa_rec;
  const despL = DATA.despesas_sub[YL].filter(l=>!['Depreciação','Amortização'].includes(l.n));
  const rb = recL.reduce((s,l)=>s+l.v,0);
  return {
    recL, despL, rb, dedRate: -a.Deducoes/rb,
    rl: a.Receita_Liquida, mb0: a.Lucro_Bruto/a.Receita_Liquida,
    da0: -a.DA, rf0: a.Resultado_Financeiro,
    ncgR: ncg/a.Receita_Liquida, cx0: DATA.dfc[YL].caixa_fim,
    prej0: DATA.lalur[YL].saldo_prej_fim,
    ll25: a.Lucro_Liquido, ir25: a.IRPJ_CSLL, lair25: a.LAIR,
    cmv25: -a.CMV_Custos, lb25: a.Lucro_Bruto,
    ebitda25: a.LAIR - a.Resultado_Financeiro - a.DA
  };
}
function fpaIRCalc(lair, saldoPrej){
  if(lair <= 0) return {ir:0, comp:0, saldo:saldoPrej - lair};
  const comp = Math.min(saldoPrej, lair*0.30);
  const base = lair - comp;
  return {ir: base*0.15 + Math.max(0, base-240000)*0.10 + base*0.09, comp, saldo:saldoPrej - comp};
}
function fpaCalc(drv, lines){
  const A = fpaAnchors();
  const mbT = drv.mb/100, cpx = drv.capex/100;
  let saldo = A.prej0, cx = A.cx0, capexAcum = 0, prevNcg = A.ncgR*A.rl;
  const rows = [];
  const recFac = A.recL.map(()=>1), despFac = A.despL.map(()=>1);
  for(let t=1; t<=3; t++){
    A.recL.forEach((l,i)=> recFac[i] *= 1 + (lines.rec[l.n][t-1]||0)/100);
    A.despL.forEach((l,i)=> despFac[i] *= 1 + (lines.desp[l.n][t-1]||0)/100);
    const recVals = A.recL.map((l,i)=> l.v*recFac[i]);
    const despVals = A.despL.map((l,i)=> l.v*despFac[i]);
    const rb = recVals.reduce((s,v)=>s+v,0);
    const ded = rb*A.dedRate, rl = rb - ded;
    const mb = A.mb0 + (mbT - A.mb0)*(t/3);
    const lb = rl*mb, cmv = rl - lb;
    const totDesp = despVals.reduce((s,v)=>s+v,0);
    const capex = rl*cpx; capexAcum += capex;
    const da = A.da0 + capexAcum*0.20;
    const ebitda = lb - totDesp;
    const ebit = ebitda - da;
    const rf = A.rf0 * (rb/A.rb);          // tarifas bancárias ~ atividade
    const lair = ebit + rf;
    const x = fpaIRCalc(lair, saldo); saldo = x.saldo;
    const ll = lair - x.ir;
    const ncg = A.ncgR*rl, dNcg = ncg - prevNcg; prevNcg = ncg;
    const fco = ll + da - dNcg;
    cx = cx + fco - capex;
    rows.push({y:FPA_YEARS[t-1], recVals, despVals, rb, ded, rl, mb, lb, cmv, totDesp,
               ebitda, mgE:ebitda/rl, da, ebit, rf, lair, ir:x.ir, comp:x.comp, ll, mgL:ll/rl,
               capex, fco, dNcg, cx, saldoPrej:saldo});
  }
  return {rows, A};
}

function arApAgg(key){
  const D = DATA[key];
  if(!isAll()) return D[state.year];
  const paidKey = key==='cp'?'pago':'recebido';
  const o = {emitido:sumYears(y=>D[y].emitido), n:sumYears(y=>D[y].n), aberto:sumYears(y=>D[y].aberto)};
  o[paidKey] = sumYears(y=>D[y][paidKey]);
  const prz = key==='cp'?'pmp':'pmr';
  o[prz] = YEARS.reduce((a,y)=>a+D[y][prz],0)/YEARS.length;
  const top={}; YEARS.forEach(y=>D[y].top.forEach(t=>top[t.n]=(top[t.n]||0)+t.v));
  o.top = Object.entries(top).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v).slice(0,8);
  if(key==='cp'){ const tp={}; YEARS.forEach(y=>D[y].tipo.forEach(t=>tp[t.n]=(tp[t.n]||0)+t.v));
    o.tipo = Object.entries(tp).map(([n,v])=>({n,v})); }
  return o;
}

/* ===================== IMOBILIZADO / INTANGÍVEL (fábrica) ===================== */

function mutacaoMapa(key, labelAno, verb){
  const D = DATA[key];
  const linha = (nome, y) => {
    const iniY = y+'-01-01', fimY = y+'-12-31';
    const antes = D.ativos.filter(a=>a.dt<iniY), noAno = D.ativos.filter(a=>a.dt>=iniY&&a.dt<=fimY);
    const custoIni = antes.reduce((a,x)=>a+x.v,0);
    const adds = noAno.reduce((a,x)=>a+x.v,0);
    const custoFim = custoIni+adds;
    const acumF = D[y].acum, acumI = y>Y0 ? D[y-1].acum : {};
    const depIni = Object.values(acumI).reduce((a,v)=>a+v,0);
    const depFim = Object.values(acumF).reduce((a,v)=>a+v,0);
    const depPer = D[y][labelAno];
    return '<tr><td><b style="color:var(--text)">'+nome+'</b></td>'+
      '<td>'+fm(custoIni)+'</td><td>'+(adds?fm(adds):'–')+'</td><td>'+fm(custoFim)+'</td>'+
      '<td>'+fm(-depIni)+'</td><td>'+fm(-depPer)+'</td><td>'+fm(-depFim)+'</td>'+
      '<td style="font-weight:600">'+fm(custoIni-depIni)+'</td><td style="font-weight:600">'+fm(custoFim-depFim)+'</td></tr>';
  };
  const ys = isAll()?YEARS:[state.year];
  const rows = ys.map(y=>linha(isAll()?('Exercício '+y):String(y), y)).join('');
  return '<div class="card mt"><h3>Mapa de mutação — '+(key==='imob'?'Imobilizado (CPC 27)':'Intangível (CPC 04)')+' <span class="sub">'+yearLabel()+' · custo × '+verb.toLowerCase()+' acumulada</span></h3>'+
    '<div class="mt tbl-scroll"><table class="data"><tr><th>Período</th><th>Custo inicial</th><th>Adições</th><th>Custo final</th>'+
    '<th>'+verb+' ac. inicial</th><th>'+verb+' do período</th><th>'+verb+' ac. final</th><th>VL inicial</th><th>VL final</th></tr>'+
    rows+'</table></div>'+
    '<div class="section-note">Movimentação do custo de aquisição e da '+verb.toLowerCase()+' acumulada no período — sem baixas, alienações ou perdas por impairment registradas. VL = valor contábil líquido.</div></div>';
}

function assetView(key, labelAno, contaNome){
  const D = DATA[key];
  const yEnd = isAll()?YL:state.year;
  const cutoff = yEnd+'-12-31';
  const ativos = D.ativos.filter(a=>a.dt<=cutoff);
  const acum = D[yEnd].acum, resid = D[yEnd].resid;
  const custoTot = ativos.reduce((a,x)=>a+x.v,0);
  const acumTot = ativos.reduce((a,x)=>a+(acum[x.id]||0),0);
  const liqTot = custoTot-acumTot;
  const depAno = isAll()? sumYears(y=>D[y][labelAno]) : D[state.year][labelAno];
  const verb = key==='imob' ? 'Depreciação' : 'Amortização';
  const rows = ativos.map(a=>{
    const ac = acum[a.id]||0, rs = a.v-ac, p = ac/a.v;
    return '<tr><td>'+esc(a.n)+(a.cat?' <span style="color:var(--dim);font-family:var(--mono);font-size:10px"> · '+esc(a.cat)+'</span>':'')+'</td>'+
      '<td>'+a.dt.split('-').reverse().join('/')+'</td><td>'+esc(a.cc)+'</td><td>'+a.vu+'m</td>'+
      '<td>'+fm(a.v)+'</td><td>'+fm(ac)+'</td>'+
      '<td><div class="bar-mini"><i style="width:'+(p*100)+'%;background:'+(p>.8?'var(--neg)':p>.5?'var(--brass)':'var(--steel)')+'"></i></div></td>'+
      '<td>'+fm(rs)+'</td></tr>';
  }).join('');
  return '<div class="grid g4">'+
    kpi('Custo de aquisição · até 12/'+yEnd, compact(custoTot), 'brass', ativos.length+' ativos registrados')+
    kpi(verb+' acumulada', compact(acumTot), 'neg', pct(acumTot/custoTot)+' do custo consumido')+
    kpi('Valor contábil líquido', compact(liqTot), 'steel', 'Conta '+contaNome)+
    kpi(verb+' do período', compact(depAno), '', 'Método linear · '+yearLabel())+
  '</div>'+
  '<div class="grid g23 mt"><div class="card"><h3>Razão auxiliar de ativos <span class="sub">posição 12/'+yEnd+'</span></h3>'+
  '<div class="mt tbl-scroll"><table class="data"><tr><th>Ativo</th><th>Aquisição</th><th>Centro de custo</th><th>Vida útil</th><th>Custo R$</th><th>'+verb+' acum.</th><th>Consumo</th><th>Valor líquido</th></tr>'+
  rows+'</table></div></div>'+
  '<div class="card"><h3>'+verb+' mensal <span class="sub">'+(isAll()?'total anual':state.year)+'</span></h3><div class="chartbox tall"><canvas id="ch-a1"></canvas></div>'+
  '<div class="section-note">Quotas lineares apropriadas mensalmente ao resultado, com contrapartida em '+verb.toLowerCase()+' acumulada (conta redutora do ativo).</div></div></div>'+
  mutacaoMapa(key, labelAno, verb);
}
